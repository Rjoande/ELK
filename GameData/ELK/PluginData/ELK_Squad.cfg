// ELK - Extended Logic Keys - stock hotkeys (the "Squad" tab)
// Re-read every time you enter Flight or the Space Center (no game restart
// needed). Global options and the key-set hotkeys are in ELK.cfg next to
// this file; each supported mod gets its own ELK_<Mod>.cfg. A preset is
// just this file with the "key" fields filled in - see the toolbar window
// or the README for the key format and the conflict warnings.
//
// Every "key" ships empty on purpose: ELK never picks a default for you, so
// a fresh install can never collide with a binding you already use.
//
// Before picking a key: whatever you bind here still shares the keyboard
// with any stock keybinding (Settings > Input) using the same physical
// key. Most stock actions only trigger on their own key's press/release, so
// this is rarely an issue - but see the "A note about Brakes" section of
// README.txt for the one confirmed exception (stock Brakes). The toolbar's
// conflict warning (non-blocking) checks every stock keybinding
// automatically; a hand-edited key here does not get that check until you
// open the toolbar once.
//
// Per slot: "key" is the hotkey; "set" is the key set the slot belongs to
// (see ELK.cfg; empty = active in every set); "map" = true lets the hotkey
// fire in map view too (on by default for the SAS modes, off for Brakes).

ELK
{
	// Set to false to switch off every hotkey of this file at once while
	// keeping the keys below.
	hotkeys = true

	// Pressing an SAS mode key below while SAS is off switches SAS on and
	// selects that mode in one go - exactly as if you had pressed the stock
	// SAS key (T) first. Set to false and an SAS key only changes mode while
	// SAS is already on, doing nothing while it is off. The toolbar window
	// has a checkbox for this.
	sas_autoengage = true

	// An SAS mode key that selects a mode also brings the navball back if
	// it is hidden (in flight and in map view, where it frees the attitude
	// controls like the navball's own button). Stock never does this.
	sas_navball = true

	BRAKES_TOGGLE
	{
		key =
		set =
		map = false
	}

	SAS_STABILITY
	{
		key =
		set =
		map = true
	}
	SAS_PROGRADE
	{
		key =
		set =
		map = true
	}
	SAS_RETROGRADE
	{
		key =
		set =
		map = true
	}
	SAS_NORMAL
	{
		key =
		set =
		map = true
	}
	SAS_ANTINORMAL
	{
		key =
		set =
		map = true
	}
	SAS_RADIAL_IN
	{
		key =
		set =
		map = true
	}
	SAS_RADIAL_OUT
	{
		key =
		set =
		map = true
	}
	SAS_TARGET
	{
		key =
		set =
		map = true
	}
	SAS_ANTITARGET
	{
		key =
		set =
		map = true
	}
	SAS_MANEUVER
	{
		key =
		set =
		map = true
	}
}
