// ELK - Extended Logic Keys - configuration
// Re-read every time you enter Flight or the Space Center (no game restart
// needed). Living under PluginData, it does not touch the ModuleManager
// cache.
//
// Every "key" below ships empty on purpose: ELK never picks a default for
// you, so it can never collide with another mod's binding on install. Set
// keys by hand here, or use the in-game toolbar (Space Center only) to
// capture them by pressing the key you want - see README.txt.
//
// Format for a "key" value: optional modifiers separated by '+', followed
// by the main key, all literal UnityEngine.KeyCode names (e.g. "Y",
// "LeftAlt+Y", "LeftControl+LeftShift+G"). A key captured through the
// toolbar is written back here automatically in this same format.
//
// Before picking a key: whatever you bind here still shares the keyboard
// with any stock keybinding (Settings > Input) using the same physical
// key. Most stock actions only trigger on their own key's press/release, so
// this is rarely an issue - but see the "A note about Brakes" section of
// README.txt for the one confirmed exception (stock Brakes). The toolbar's
// conflict warning (non-blocking) checks every stock keybinding
// automatically; a hand-edited key here does not get that check until you
// open the toolbar once.

ELK
{
	enabled = true

	// Set to false to hide the Space Center toolbar button/window entirely
	// and rely only on hand-editing this file.
	toolbar = true

	BRAKES_TOGGLE
	{
		key = 
	}

	SAS_STABILITY
	{
		key = 
	}
	SAS_PROGRADE
	{
		key = 
	}
	SAS_RETROGRADE
	{
		key = 
	}
	SAS_NORMAL
	{
		key = 
	}
	SAS_ANTINORMAL
	{
		key = 
	}
	SAS_RADIAL_IN
	{
		key = 
	}
	SAS_RADIAL_OUT
	{
		key = 
	}
	SAS_TARGET
	{
		key = 
	}
	SAS_ANTITARGET
	{
		key = 
	}
	SAS_MANEUVER
	{
		key = 
	}
}
