// ELK - Extended Logic Keys - master configuration
// Re-read every time you enter Flight or the Space Center (no game restart
// needed). Living under PluginData, it does not touch the ModuleManager
// cache.
//
// This file holds only the global options and the key-set switching
// hotkeys. The hotkeys themselves live in one file per tab, next to this
// one: ELK_Squad.cfg (stock Brakes and SAS modes, shipped with the mod) and
// ELK_<Mod>.cfg for each supported mod, created empty the first time ELK
// runs with that mod installed and never deleted. A preset is any of those
// per-tab files with the keys filled in; it never needs to touch this one.
//
// Format for a "key" value, in every file: optional modifiers separated by
// '+', followed by the main key, all literal UnityEngine.KeyCode names
// (e.g. "Y", "LeftAlt+Y", "LeftControl+LeftShift+G"). A key captured
// through the toolbar is written back in this same format. Every key ships
// empty on purpose: ELK never picks a default for you, so it can never
// collide with another mod's binding on install.
//
// Key sets: name some sets here (comma-separated, in the order the SET_NEXT
// hotkey rotates through them, e.g. "sets = Stock, MechJeb, AA") and then
// assign slots to them ("set = MechJeb" in a slot node, or the button next
// to each row in the toolbar). A slot with an empty set works in every
// set; the others only while their set is the active one, so the same
// physical key can drive the stock SAS in one set and another mod in the
// next. With "sets" empty (the default) every slot is simply always active.

ELK
{
	enabled = true

	// Set to false to hide the Space Center toolbar button/window entirely
	// and rely only on hand-editing the cfg files.
	toolbar = true

	// Key sets, see above. Empty = the feature is off.
	sets =

	// The set new vessels start in (and the only set when sets_per_vessel
	// is false). Must be one of the names in "sets"; otherwise the first.
	active_set =

	// true: each vessel remembers its own active set inside the save game
	// (a plane can live in the AA set while a rocket stays in Stock);
	// switching in flight changes that vessel only. false: one global set.
	sets_per_vessel = true

	// Leaving a set in flight (SET_NEXT / SET_PREV) switches off whatever
	// the keys of that set control (SAS, brakes, AA master, SmartASS,
	// Translatron, a running landing / ascent / node execution), so the
	// keys of the next set never fight them. "*" = every set; a list of
	// names = only those; empty = never. Slots marked "always" are never
	// switched off. Nothing else triggers this: not a scene change, not
	// switching vessel.
	sets_disengage = *

	SET_NEXT
	{
		key =
	}
	SET_PREV
	{
		key =
	}
}
