// NumPad - ELK preset (stock "Squad" tab)
// Author: Rjoande
// Every SAS mode on the numeric keypad, laid out like the navball itself:
// the 3x3 block is a compass around Maneuver (5), with each mode and its
// opposite on opposite ends of an axis - prograde/retrograde vertical,
// radial in/out horizontal, normal/anti-normal and target/anti-target on
// the two diagonals. Stability Assist sits under the thumb on 0, brakes on
// the far corner key. See NumPad-layout.png for the whole map in one
// picture.
//
// Needs a real numeric keypad with Num Lock on. LeftAlt is the modifier
// throughout, so the bare keypad keeps whatever it does for you already.
//
// Install: copy this file to GameData/ELK/PluginData/ELK_Squad.cfg
// (replacing the existing one) with KSP closed. See ../README.txt.
// "set" is left empty on purpose: the keys work in every key set. "map"
// keeps the shipped defaults (SAS modes also work in map view).

ELK
{
	hotkeys = true
	sas_autoengage = true
	sas_navball = true

	BRAKES_TOGGLE
	{
		key = LeftAlt+KeypadMultiply
		set =
		map = false
	}
	SAS_STABILITY
	{
		key = LeftAlt+Keypad0
		set =
		map = true
	}
	SAS_PROGRADE
	{
		key = LeftAlt+Keypad8
		set =
		map = true
	}
	SAS_RETROGRADE
	{
		key = LeftAlt+Keypad2
		set =
		map = true
	}
	SAS_NORMAL
	{
		key = LeftAlt+Keypad9
		set =
		map = true
	}
	SAS_ANTINORMAL
	{
		key = LeftAlt+Keypad1
		set =
		map = true
	}
	SAS_RADIAL_IN
	{
		key = LeftAlt+Keypad4
		set =
		map = true
	}
	SAS_RADIAL_OUT
	{
		key = LeftAlt+Keypad6
		set =
		map = true
	}
	SAS_TARGET
	{
		key = LeftAlt+Keypad7
		set =
		map = true
	}
	SAS_ANTITARGET
	{
		key = LeftAlt+Keypad3
		set =
		map = true
	}
	SAS_MANEUVER
	{
		key = LeftAlt+Keypad5
		set =
		map = true
	}
}
